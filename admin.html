<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | MediTech</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-login { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--light); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-box { background: white; padding: 40px; border-radius: 16px; box-shadow: var(--shadow-lg); text-align: center; max-width: 400px; width: 90%; }
        .login-box h2 { color: var(--primary); margin-bottom: 10px; }
        .login-box input { width: 100%; padding: 12px; margin: 15px 0; border: 2px solid var(--light-gray); border-radius: 8px; }
        .login-box button { width: 100%; padding: 12px; background: var(--gradient-1); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .error-msg { color: var(--danger); font-size: 14px; margin-top: 10px; display: none; }
        .admin-panel { display: none; max-width: 900px; margin: 80px auto 40px; padding: 20px; }
        .price-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; align-items: center; background: var(--white); padding: 12px; border-radius: 10px; border: 1px solid var(--light-gray); }
        .price-row input { padding: 10px; border: 2px solid var(--light-gray); border-radius: 8px; width: 100%; }
        .price-row .label { font-weight: 600; color: var(--dark); }
        .admin-actions { margin-top: 20px; display: flex; gap: 10px; }
        .admin-actions button { padding: 12px 24px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        #saveBtn { background: var(--gradient-1); color: white; }
        #resetBtn { background: var(--light); color: var(--dark); border: 1px solid var(--light-gray); }
        #status { margin-top: 10px; font-weight: 500; min-height: 20px; }
        @media(max-width: 768px) { .price-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="admin-login" id="loginScreen">
      <div class="login-box">
        <h2><i class="fas fa-lock"></i> Admin Access</h2>
        <p>Enter your password to manage product pricing</p>
        <input type="password" id="adminPass" placeholder="Password">
        <button onclick="checkLogin()">Secure Login</button>
        <p class="error-msg" id="loginError">⚠️ Incorrect password. Please try again.</p>
      </div>
    </div>

    <!-- Admin Panel -->
    <div class="admin-panel" id="adminPanel">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2><i class="fas fa-cogs"></i> MediTech Admin Panel</h2>
        <button onclick="logout()" style="padding:8px 16px; background:var(--danger); color:white; border:none; border-radius:6px; cursor:pointer;">Logout</button>
      </div>
      <p style="color:#666; margin-bottom:20px;">Changes are saved to the cloud automatically. All devices will update instantly.</p>

      <div id="priceEditor"></div>

      <div class="admin-actions">
        <button id="saveBtn" onclick="saveToCloud()">💾 Save All Prices to Cloud</button>
        <button id="resetBtn" onclick="loadFromCloud()">🔄 Refresh / Load Latest</button>
      </div>
      <p id="status"></p>
    </div>

    <script>
      // 🔑 ADMIN CLOUD CONFIGURATION
      const ADMIN_CONFIG = {
        WRITE_KEY: '$2a$10$.mXd8/sjnbUDugk691cwLu4eti7uFFlY1K.7/Hkja.3avSFQDycgi', // Replace with JSONbin Write Key
        BIN_ID: '6a032124c0954111d810f38b'            // Replace with your Bin ID
      };

      let productData = [];

      // Simple Password Check (Change 'meditech2026' to your desired password)
      function checkLogin() {
        const pass = document.getElementById('adminPass').value;
        if(pass === 'meditech2026') {
          document.getElementById('loginScreen').style.display = 'none';
          document.getElementById('adminPanel').style.display = 'block';
          loadFromCloud();
        } else {
          document.getElementById('loginError').style.display = 'block';
        }
      }
      function logout() { location.reload(); }

      // Load prices from cloud
      async function loadFromCloud() {
        const status = document.getElementById('status');
        status.textContent = '⏳ Loading prices...';
        try {
          const res = await fetch(`https://api.jsonbin.io/v3/b/${ADMIN_CONFIG.BIN_ID}/latest?t=${Date.now()}`, {
            headers: { 'X-Master-Key': ADMIN_CONFIG.WRITE_KEY }
          });
          if(!res.ok) throw new Error('Failed to fetch');
          const { record } = await res.json();
          productData = record.products;
          renderEditor();
          status.textContent = '✅ Prices loaded from cloud.';
          status.style.color = 'var(--success)';
        } catch(e) {
          status.textContent = '❌ Error: ' + e.message;
          status.style.color = 'var(--danger)';
        }
      }

      // Render inputs
      function renderEditor() {
        const editor = document.getElementById('priceEditor');
        editor.innerHTML = '';
        productData.forEach((p, i) => {
          editor.innerHTML += `
            <div class="price-row">
              <span class="label">Product ${i+1}</span>
              <input type="number" class="p-old" data-i="${i}" value="${p.old}" placeholder="Old Price">
              <input type="number" class="p-new" data-i="${i}" value="${p.new}" placeholder="New Price">
              <input type="number" class="p-disc" data-i="${i}" value="${p.discount}" placeholder="Discount %">
            </div>
          `;
        });
      }

      // Save to cloud
      async function saveToCloud() {
        const btn = document.getElementById('saveBtn');
        const status = document.getElementById('status');
        btn.disabled = true;
        btn.textContent = '⏳ Saving...';
        status.textContent = '';

        // Collect updated values
        document.querySelectorAll('.p-old').forEach(el => productData[el.dataset.i].old = Number(el.value));
        document.querySelectorAll('.p-new').forEach(el => productData[el.dataset.i].new = Number(el.value));
        document.querySelectorAll('.p-disc').forEach(el => productData[el.dataset.i].discount = Number(el.value));

        try {
          await fetch(`https://api.jsonbin.io/v3/b/${ADMIN_CONFIG.BIN_ID}`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'X-Master-Key': ADMIN_CONFIG.WRITE_KEY
            },
            body: JSON.stringify({ products: productData })
          });
          status.textContent = '✅ Pricing updated successfully! All devices will sync shortly.';
          status.style.color = 'var(--success)';
        } catch(e) {
          status.textContent = '❌ Save failed. Check console & API Keys.';
          status.style.color = 'var(--danger)';
        } finally {
          btn.disabled = false;
          btn.textContent = '💾 Save All Prices to Cloud';
        }
      }

      // Enter key to login
      document.getElementById('adminPass').addEventListener('keypress', e => {
        if(e.key === 'Enter') checkLogin();
      });
    </script>
</body>
</html>
